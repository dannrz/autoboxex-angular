<header
    class="flex h-12 shrink-0 items-center gap-2 border-b border-surface-200 dark:border-surface-700 px-4 justify-between">
    <button pButton pSidebarTrigger target="preview" severity="secondary" text size="small">
        <svg data-p-icon="sidebar"></svg>
    </button>
    <button pButton severity="secondary" text size="small" (click)="theme.toggle()"
        [attr.aria-label]="theme.isDark() ? 'Activar modo claro' : 'Activar modo oscuro'">
        @if (theme.isDark()) {
        <svg data-p-icon="sun"></svg>
        } @else {
        <svg data-p-icon="moon"></svg>
        }
    </button>
</header>
